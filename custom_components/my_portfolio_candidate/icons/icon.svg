<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Äußerer Kreis (Zielscheibe) -->
  <circle cx="11" cy="13" r="9.5" fill="none" stroke="#2563eb" stroke-width="1.4" opacity="0.35"/>
  <!-- Mittlerer Kreis -->
  <circle cx="11" cy="13" r="6" fill="none" stroke="#2563eb" stroke-width="1.4" opacity="0.55"/>
  <!-- Innerer Kreis (Bullseye) -->
  <circle cx="11" cy="13" r="2.5" fill="#2563eb" opacity="0.80"/>
  <!-- Aufwärtspfeil oben rechts -->
  <polyline points="16,2 21,2 21,7" fill="none" stroke="#2563eb" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="14" y1="9" x2="21" y2="2" stroke="#2563eb" stroke-width="1.8"
        stroke-linecap="round"/>
</svg>
